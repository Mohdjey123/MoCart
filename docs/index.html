<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MoCart - Your Windows 98 style shopping experience">
    <title>MoCart - Products</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="window" role="banner">
        <div class="title-bar">
            <div class="title-bar-text">MoCart - Products</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
    </header>

    <nav class="taskbar" role="navigation">
        <div class="start-menu">
            <button id="start-button" aria-expanded="false" aria-controls="start-menu-content">Start</button>
            <div id="start-menu-content" class="start-menu-content" role="menu">
                <ul>
                    <li role="menuitem"><a href="index.html" aria-current="page">Home</a></li>
                    <li role="menuitem"><a href="index.html">Products</a></li>
                    <li role="menuitem"><a href="cart.html">Cart</a></li>
                    <li role="menuitem"><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="taskbar-items">
            <span>MoCart</span>
        </div>
    </nav>

    <main>
        <section id="products" class="window" role="main">
            <h1 class="title-bar-text">Our Products</h1>
            <div id="product-list" class="window-content" aria-live="polite">
                <!-- Products will be loaded here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
